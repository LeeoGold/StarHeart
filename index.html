<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigBang x U</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%96%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #030518;
            overflow: hidden;
            font-family: monospace; /* Para que el asterisco se vea uniforme */
        }
        canvas {
            display: block;
        }
        #musicBox {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10;
        }
        #musicBox a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #ffd700);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        #musicBox a:hover {
            transform: scale(1.1);
            box-shadow: 0 0 28px rgba(255, 215, 0, 0.7);
        }
        #musicBox svg {
            width: 28px;
            height: 28px;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.8));
        }
        @media (max-width: 480px) {
            #musicBox {
                top: 8px;
                right: 8px;
            }
            #musicBox a {
                width: 48px;
                height: 48px;
            }
        }
    </style>
</head>
<body>
    <canvas id="espacio"></canvas>

    <div id="musicBox">
        <a href="https://youtu.be/2vLeLNNl--E" target="_blank" rel="noopener" aria-label="Escuchar el video en YouTube">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <polygon points="34,24 34,76 78,50" fill="#ffffff" />
            </svg>
        </a>
    </div>

    <script>
        const canvas = document.getElementById('espacio');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        let startTime = Date.now();
        let phaseState = -1; // Para controlar cuándo ocurre la explosión
        let sparks = []; // Chispas temporales del Big Bang
        let fontsLoaded = false; // Evita que el texto se muestre dos veces (fallback -> Great Vibes)
        if (document.fonts && document.fonts.load) {
            document.fonts.load("italic 600 20px 'Great Vibes'")
                .then(() => { fontsLoaded = true; })
                .catch(() => { fontsLoaded = true; });
        } else {
            fontsLoaded = true;
        }

        // Ajustar al tamaño de la pantalla
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            width = window.innerWidth;
            height = window.innerHeight;
            initParticles(); // Reiniciar partículas si cambian el tamaño de ventana
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);

        // Clase Partícula (Estrella / Asterisco)
        class Particle {
            constructor() {
                // Ecuación paramétrica del corazón para definir su posición original
                let t = Math.random() * Math.PI * 2;

                // Tamaño adaptable según la pantalla
                let scale = Math.min(width, height) / 50;

                // Coordenadas objetivo (formando el corazón)
                this.targetX = scale * (16 * Math.pow(Math.sin(t), 3));
                this.targetY = -scale * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                // Posición actual
                this.x = this.targetX;
                this.y = this.targetY;

                // Velocidad para el espacio
                this.vx = 0;
                this.vy = 0;

                // Color y tamaño de la estrella
                const colors = ['#ffd700', '#ffea00', '#fff3b0', '#a855f7', '#c084fc', '#7c3aed'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.size = Math.random() * 10 + 8; // Tamaño de fuente del *

                // Rotación del *
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.1;
            }
        }

        // Estrella chispa que aparece temporalmente durante el Big Bang
        class Spark {
            constructor() {
                // Nace desde el centro (el núcleo del Big Bang)
                this.x = (Math.random() - 0.5) * 10;
                this.y = (Math.random() - 0.5) * 10;
                let dir = Math.random() * Math.PI * 2;
                let speed = Math.random() * (Math.min(width, height) / 16) + 18;
                this.vx = Math.cos(dir) * speed;
                this.vy = Math.sin(dir) * speed;
                this.life = Math.random() * 80 + 50; // Frames que brillará
                this.maxLife = this.life;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.25;
                const sparkColors = ['#ffd700', '#ffea00', '#fff3b0', '#ffffff', '#c084fc', '#a855f7'];
                this.color = sparkColors[Math.floor(Math.random() * sparkColors.length)];
                this.size = Math.random() * 8 + 5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.93;
                this.vy *= 0.93;
                this.life--;
            }
        }

        function initParticles() {
            particles = [];
            sparks = []; // Limpiar chispas sobrantes al reiniciar
            // 800 estrellas forman el corazón
            for (let i = 0; i < 800; i++) {
                particles.push(new Particle());
            }
        }

        let lastFrame = 0;
        const FRAME_MS = 1000 / 45;

        function animate(ts) {
            requestAnimationFrame(animate);

            // Limitar el dibujo a ~45 FPS para una animación fluida y constante
            if (lastFrame && ts - lastFrame < FRAME_MS) return;
            lastFrame = ts;

            // Fondo con rastro oscuro para efecto de movimiento/velocidad
            ctx.fillStyle = 'rgba(3, 5, 24, 0.4)';
            ctx.fillRect(0, 0, width, height);

            let t = (Date.now() - startTime) / 1000;
            // Ciclo completo de 31 segundos
            let cycle = t % 31; 

            // Centrar el dibujo en la pantalla
            ctx.save();
            ctx.translate(width / 2, height / 2 - 20);

            if (cycle < 7) {
                // FASE 1: Corazón formado y latiendo (0 - 7s)
                phaseState = 0;
                let beat = 1 + 0.08 * Math.sin(cycle * Math.PI * 4); // Latido suave
                
                particles.forEach(p => {
                    // Mover suavemente hacia la posición objetivo latiendo
                    p.x += (p.targetX * beat - p.x) * 0.1;
                    p.y += (p.targetY * beat - p.y) * 0.1;
                });
            } 
            else if (cycle < 12) {
                // FASE 2: Contracción / Implosión (7 - 12s)
                phaseState = 1;
                let p2 = (cycle - 7) / 5;
                particles.forEach(p => {
                    // Todas las estrellas se sienten atraídas al centro con aceleración progresiva
                    let pull = 0.03 + 0.12 * p2;
                    p.x += (0 - p.x) * pull;
                    p.y += (0 - p.y) * pull;
                });
            } 
            else if (cycle < 24) {
                // FASE 3: Big Bang y flotar en el espacio (12 - 24s)
                if (phaseState !== 2) {
                    // Se ejecuta SOLO una vez al iniciar esta fase para dar el impulso explosivo
                    particles.forEach(p => {
                        let angle = Math.random() * Math.PI * 2;
                        // Velocidad de explosión que cubre toda la pantalla
                        let speed = Math.random() * (Math.min(width, height) / 25) + 5;
                        p.vx = Math.cos(angle) * speed;
                        p.vy = Math.sin(angle) * speed;
                    });
                    // Chispas temporales que solo aparecen durante el Big Bang
                    for (let i = 0; i < 180; i++) sparks.push(new Spark());
                    phaseState = 2;
                }
                
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    // Fricción cósmica: frena las estrellas gradualmente para que floten
                    p.vx *= 0.93;
                    p.vy *= 0.93;
                    
                    // Ligeramente flotan a la deriva
                    p.x += Math.sin(p.angle) * 0.5;
                    p.y += Math.cos(p.angle) * 0.5;
                });
            } 
            else {
                // FASE 4: Reconstrucción (24 - 31s)
                phaseState = 3;
                particles.forEach(p => {
                    // Las estrellas viajan de vuelta hacia sus coordenadas exactas del corazón
                    p.x += (p.targetX - p.x) * 0.04; // Se acercan progresivamente
                    p.y += (p.targetY - p.y) * 0.04;
                });
            }

            // Dibujar las estrellas (*)
            ctx.textBaseline = "middle";
            ctx.textAlign = "center";
            
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.font = `${p.size}px monospace`;
                
                // Añadir un poco de rotación individual a las estrellas
                p.angle += p.spin;
                
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.fillText("*", 0, 0);
                ctx.restore();
            });

            // Chispas del Big Bang: brillan y se apagan temporalmente
            for (let i = 0; i < sparks.length; i++) sparks[i].update();
            sparks = sparks.filter(s => s.life > 0);

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            sparks.forEach(s => {
                ctx.globalAlpha = Math.min(1, s.life / (s.maxLife * 0.5));
                ctx.fillStyle = s.color;
                ctx.font = `${s.size}px monospace`;
                s.angle += s.spin;
                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.rotate(s.angle);
                ctx.fillText("*", 0, 0);
                ctx.restore();
            });
            ctx.restore();
            ctx.globalAlpha = 1;

            // Texto de dedicatoria: aparece tras el Big Bang y se desvanece antes de la reformación
            if (fontsLoaded && cycle >= 14 && cycle < 22.5) {
                let fadeIn = Math.min(1, (cycle - 14) / 1.2);
                let fadeOut = Math.min(1, (22.5 - cycle) / 1.2);
                let alpha = Math.max(0, Math.min(fadeIn, fadeOut));

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.shadowColor = 'rgba(255, 215, 0, 0.8)';
                ctx.shadowBlur = 25;

                let g = ctx.createLinearGradient(0, -80, 0, 50);
                g.addColorStop(0, '#ffd700');
                g.addColorStop(0.5, '#fff3b0');
                g.addColorStop(1, '#c084fc');
                ctx.fillStyle = g;

                let fs = Math.min(width, height);
                ctx.font = `italic 600 ${fs / 10}px 'Great Vibes', 'Georgia', serif`;
                ctx.fillText("Feliz 21 de setiembre", 0, -fs / 22);

                ctx.font = `italic 600 ${fs / 6.5}px 'Great Vibes', 'Georgia', serif`;
                ctx.fillText("I love U", 0, fs / 9);

                ctx.restore();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        // Iniciar
        resize();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
